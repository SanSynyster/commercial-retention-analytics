<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="790" viewBox="0 0 1420 790" role="img" aria-labelledby="title desc">
<title id="title">Six descriptive purchase-frequency and recency groups</title>
<desc id="desc">Six mutually exclusive groups by distinct observed purchase days and recency as of the partial 2011-12-09 source end. Bars show customer counts and share of identified qualifying gross merchandise.</desc>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="65.0" y="55.0" font-family="Arial, Helvetica, sans-serif" font-size="27px" fill="#172B3A" text-anchor="start" font-weight="700">Six descriptive frequency × recency groups</text>
<text x="65.0" y="84.0" font-family="Arial, Helvetica, sans-serif" font-size="14px" fill="#5B6B78" text-anchor="start" font-weight="400">Recency is as of 2011-12-09, a partially observed final source date; labels are descriptive, not churn states.</text>
<text x="65.0" y="191.0" font-family="Arial, Helvetica, sans-serif" font-size="14px" fill="#172B3A" text-anchor="start" font-weight="600">One purchase day · 0–59d</text>
