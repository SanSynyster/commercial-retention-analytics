<text x="390.0" y="137.0" font-family="Arial, Helvetica, sans-serif" font-size="13px" fill="#5B6B78" text-anchor="start" font-weight="700">Customers</text>
<text x="1000.0" y="137.0" font-family="Arial, Helvetica, sans-serif" font-size="13px" fill="#5B6B78" text-anchor="start" font-weight="700">Share of identified qualifying gross (0–100%)</text>
<text x="65.0" y="700.0" font-family="Arial, Helvetica, sans-serif" font-size="12px" fill="#5B6B78" text-anchor="start" font-weight="400">Frequency uses distinct purchase days; multiple same-day invoices remain one day. Group values reconcile to 5,852 customers and £17,123,740.997.</text>
<text x="65.0" y="729.0" font-family="Arial, Helvetica, sans-serif" font-size="12px" fill="#5B6B78" text-anchor="start" font-weight="400">Recent-first-observed (inclusive 0–30 days) and top-decile flags are independent; neither is a targeting or predictive rule.</text>
<text x="65.0" y="758.0" font-family="Arial, Helvetica, sans-serif" font-size="12px" fill="#5B6B78" text-anchor="start" font-weight="400">0–30 days is a descriptive implementation convention, not an owner-approved canonical threshold.</text>
</svg>
